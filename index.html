<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>思维生长站 · 科技增强体验版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function(){if(window.Chart)return;const store=new Map(),pal=['#5a8cff','#6fd6ff','#8b7dff','#4ade80','#fbbf24','#fb7185'];class MiniChart{
constructor(c,cfg){this.c=c;this.cfg=cfg;store.set(c,this);this.draw()}
destroy(){store.delete(this.c);this.c.getContext('2d')?.clearRect(0,0,this.c.width,this.c.height)}
draw(){const c=this.c,cfg=this.cfg,labels=cfg.data.labels,ds=cfg.data.datasets[0],vals=ds.data,type=cfg.type,w=Math.max(230,(c.parentElement?.clientWidth||380)-35),h=(type==='bar'&&labels.length>9)?370:245,dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);x.font='11px system-ui';const txt=(t,px,py,align='center')=>{x.fillStyle='#d9e9ff';x.textAlign=align;x.fillText(String(t),px,py)};
if(type==='pie'){let angle=-Math.PI/2,sum=vals.reduce((a,b)=>a+b,0)||1;vals.forEach((v,i)=>{x.beginPath();x.moveTo(w*.35,h*.48);x.arc(w*.35,h*.48,Math.min(85,w*.26),angle,angle+v/sum*Math.PI*2);x.closePath();x.fillStyle=pal[i%6];x.fill();angle+=v/sum*Math.PI*2});labels.forEach((l,i)=>{x.fillStyle=pal[i%6];x.fillRect(w*.6,45+i*25,9,9);txt(l+':'+vals[i],w*.6+17,53+i*25,'left')});return}
if(type==='radar'){const n=labels.length,cx=w/2,cy=h/2+5,R=Math.min(w*.30,h*.30);for(let z=1;z<=4;z++){x.beginPath();labels.forEach((l,i)=>{let a=-Math.PI/2+i*Math.PI*2/n,r=R*z/4,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.strokeStyle='#385274';x.stroke()}
labels.forEach((l,i)=>{let a=-Math.PI/2+i*Math.PI*2/n;txt(l,cx+Math.cos(a)*(R+30),cy+Math.sin(a)*(R+24))});x.beginPath();vals.forEach((v,i)=>{let a=-Math.PI/2+i*Math.PI*2/n,r=R*Math.min(4,v)/4,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fillStyle='rgba(90,140,255,.20)';x.fill();x.strokeStyle='#6fd6ff';x.lineWidth=2;x.stroke();return}
if(type==='bar'&&labels.length>9){const left=70,dx=w-left-30,bh=(h-10)/labels.length;labels.forEach((l,i)=>{let y=i*bh;txt(l,left-7,y+bh*.70,'right');x.fillStyle='#1a3354';x.fillRect(left,y+6,dx,bh-11);x.fillStyle=pal[i%6];x.fillRect(left,y+6,dx*Math.min(4,vals[i])/4,bh-11)});return}
const lx=38,rx=w-16,top=15,bot=h-34;for(let z=0;z<=4;z++){const y=bot-(bot-top)*z/4;x.strokeStyle='rgba(150,180,220,.15)';x.beginPath();x.moveTo(lx,y);x.lineTo(rx,y);x.stroke();txt(z,lx-13,y+3)}
const dx=(rx-lx)/Math.max(1,labels.length-(type==='bar'?0:1));if(type==='line'){x.beginPath();vals.forEach((v,i)=>{const px=lx+i*dx,py=bot-(bot-top)*v/4;i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle='#6fd6ff';x.lineWidth=3;x.stroke()}else vals.forEach((v,i)=>{x.fillStyle=pal[i%6];x.fillRect(lx+dx*(i+.15),bot-(bot-top)*v/4,dx*.7,(bot-top)*v/4)});labels.forEach((l,i)=>txt(l,lx+dx*(i+(type==='bar'?.5:0)),h-12));}
static getChart(a){return store.get(typeof a==='string'?document.getElementById(a):a)}
}window.Chart=MiniChart;window.addEventListener('resize',()=>store.forEach(c=>c.draw()))})();
</script>
<style>
:root{--bg:#071429;--panel:#0b1d39;--panel2:#10284d;--card:rgba(18,38,75,.82);--line:rgba(124,171,255,.18);--text:#e9f1ff;--muted:#95abd0;--cyan:#6fd6ff;--blue:#5a8cff;--vio:#8b7dff;--green:#4ade80;--amber:#fbbf24;--rose:#fb7185;--shadow:0 18px 50px rgba(0,0,0,.35)}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 20%,#163360 0,#081426 42%,#050d18 100%);color:var(--text)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.header{position:sticky;top:0;z-index:15;background:rgba(7,20,41,.84);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.header-inner{max-width:1380px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:14px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4da8ff,#8f7bff);box-shadow:0 0 0 4px rgba(112,160,255,.12),0 12px 25px rgba(49,116,255,.32)}.brand h1{margin:0;font-size:22px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.nav{display:flex;gap:12px;flex-wrap:wrap}.nav button{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));color:var(--text);padding:10px 14px;border-radius:12px;cursor:pointer}.nav button.active{background:linear-gradient(135deg,#3f83ff,#6b7dff);border-color:transparent}
.wrap{max-width:1380px;margin:0 auto;padding:22px 18px 80px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:18px}.card{background:linear-gradient(180deg,rgba(18,38,75,.92),rgba(10,24,49,.92));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero-main{padding:28px}.hero-main h2{font-size:34px;line-height:1.2;margin:0 0 12px}.hero-main p{color:var(--muted);line-height:1.75}.badge-row{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}.badge{padding:8px 12px;border-radius:999px;background:rgba(111,214,255,.10);border:1px solid rgba(111,214,255,.18);font-size:13px;color:#d5ebff}.hero-side{padding:22px;display:grid;gap:12px}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:16px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line)}.stat b{display:block;font-size:28px;margin-bottom:6px}.stat span{font-size:13px;color:var(--muted)}.warn{padding:14px 16px;border-radius:16px;background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.18);color:#ffe6a7;font-size:14px;line-height:1.65}
.grid{display:grid;grid-template-columns:270px 1fr;gap:18px}.sidebar{padding:18px;align-self:start;position:sticky;top:86px}.side-title{font-size:15px;color:#d6e6ff;margin:0 0 14px}.side-group{display:grid;gap:10px}.side-link{display:block;padding:13px 14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#dce8ff;cursor:pointer}.side-link.active,.side-link:hover{background:linear-gradient(135deg,rgba(67,120,255,.34),rgba(122,101,255,.28));transform:translateY(-1px)}
.content{display:grid;gap:18px}.section{padding:20px}.section h3{margin:0 0 14px;font-size:22px}.sub{font-size:13px;color:var(--muted);margin-top:-4px;margin-bottom:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar select,.toolbar input,.toolbar textarea{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.toolbar input::placeholder,.toolbar textarea::placeholder{color:#8ca3cb}.btn{background:linear-gradient(135deg,#4386ff,#7a65ff);border:none;color:white;padding:10px 14px;border-radius:12px;cursor:pointer}.btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.mini{padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--line)}.mini h4{margin:0 0 8px;font-size:17px}.mini p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.k{display:inline-block;font-size:12px;color:#dbecff;background:rgba(90,140,255,.14);padding:4px 8px;border-radius:999px;border:1px solid rgba(90,140,255,.2);margin-right:6px;margin-bottom:6px}
.charts2,.charts3{display:grid;gap:16px}.charts2{grid-template-columns:repeat(2,minmax(0,1fr))}.charts3{grid-template-columns:repeat(3,minmax(0,1fr))}.chartbox{padding:18px;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-height:320px}.chartbox h4{margin:0 0 10px;font-size:17px}.tablewrap{overflow:auto;border-radius:18px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:960px}th,td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;text-align:left}th{background:rgba(255,255,255,.04);color:#cfe1ff}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px}.pill.b{background:rgba(74,222,128,.12);color:#b8ffd0}.pill.m{background:rgba(91,140,255,.14);color:#d4e2ff}.pill.l{background:rgba(251,113,133,.14);color:#ffd4dc}.dimgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.dim{padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03)}.dim label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.dim b{font-size:20px}.row2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.upload-zone{border:1.5px dashed rgba(111,214,255,.25);border-radius:18px;padding:18px;background:rgba(255,255,255,.02)}.preview{margin-top:12px;display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:start}.preview img{width:100%;border-radius:14px;border:1px solid var(--line);object-fit:cover;aspect-ratio:1}.analysis{padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);color:#dce9ff}.analysis ul{margin:8px 0 0 18px;padding:0;line-height:1.8}.chatfab{position:fixed;right:20px;bottom:22px;width:72px;height:72px;border:none;border-radius:999px;background:radial-gradient(circle at 30% 30%,#88e1ff,#4676ff 55%,#6b6cff);color:white;font-weight:700;box-shadow:0 12px 30px rgba(54,106,255,.5);z-index:30;display:none}.chatfab small{display:block;font-size:12px}.chat{position:fixed;right:20px;bottom:104px;width:min(390px,calc(100vw - 24px));height:min(620px,calc(100vh - 126px));display:none;grid-template-rows:auto 1fr auto;z-index:31}.chat.open{display:grid}.chat .head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat .body{padding:16px;overflow:auto;display:grid;align-content:start;gap:10px}.bubble{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);line-height:1.7}.bubble.me{background:linear-gradient(135deg,rgba(67,134,255,.28),rgba(122,101,255,.25))}.chat .foot{padding:14px;border-top:1px solid var(--line);display:grid;gap:10px}.chat textarea{min-height:82px;resize:vertical;background:rgba(255,255,255,.04);color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.footrow{display:flex;gap:10px}.footrow select{flex:0 0 118px;background:rgba(255,255,255,.05);color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.mobile-tabs{display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(7,20,41,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20}.mobile-tabs .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mobile-tabs button{padding:10px 4px;border-radius:14px;font-size:12px}
@media (max-width:1080px){.hero,.grid,.row2,.charts2,.charts3{grid-template-columns:1fr}.sidebar{position:static}.header-inner{align-items:flex-start;flex-direction:column}.statgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.preview{grid-template-columns:1fr}}
@media (max-width:720px){.wrap{padding:16px 14px 98px}.brand h1{font-size:20px}.brand p{font-size:12px}.header-inner{padding:12px 14px}.hero-main h2{font-size:28px}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav.topnav{display:none}.mobile-tabs{display:block}.sidebar{display:none}.chat{right:0;left:0;bottom:0;width:100vw;height:100vh;border-radius:0}.chatfab{display:block}}
</style>

<body>
<header class="header"><div class="header-inner"><div class="brand"><div class="logo"></div><div><h1>思维生长站</h1><p>小学数学高阶思维培育 · 科技增强体验版</p></div></div><div class="nav topnav"><button id="top-home" onclick="go('/')">平台首页</button><button id="top-teacher" onclick="go('/teacher.html')">教师工作台</button><button id="top-student" onclick="go('/student.html')">学生学习台</button></div></div></header>
<div class="wrap" id="app"></div>
<div class="mobile-tabs"><div class="nav"><button onclick="go('/')">首页</button><button onclick="go('/teacher.html')">教师端</button><button onclick="go('/student.html')">学生端</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})">顶部</button></div></div>
<button class="chatfab" id="chatFab" onclick="toggleChat()">🤖<small>小思</small></button>
<div class="card chat" id="chatBox"><div class="head"><strong>🤖 小思 · 深度思考伙伴</strong><button class="btn secondary" onclick="toggleChat()">关闭</button></div><div class="body" id="chatBody"><div class="bubble">你好，我是小思。你可以问我数学问题，我会尽量用启发式提问帮助你思考，而不是直接替你完成答案。</div></div><div class="foot"><div class="footrow"><select id="chatMode"><option>启发式</option><option>建构式</option><option>评估式</option></select><button class="btn" onclick="sendChat()">发送</button></div><textarea id="chatInput" placeholder="例如：为什么这个方法成立？如果条件变化怎么办？"></textarea></div></div>
<script>
const role=location.pathname.includes('teacher')?'teacher':location.pathname.includes('student')?'student':'home';
let DATA={tasks:[],students:[],submissions:[],evaluations:[],uploads:[],dashboard:null};
const PRIMARY=['抽象概括思维','策略灵活思维','批判质疑思维','迁移应用思维','创新生成思维'];
const SECONDARY=['抽象性','概括性','多样性','择优性','质疑性','辩证性','建构性','迁移性','化归性','拓展性','发散性','独创性'];
const $=id=>document.getElementById(id);
const safe=t=>String(t??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
function go(p){location.href=p}
function api(p,opt){return fetch(p,opt).then(r=>r.json())}
async function boot(){
  const [status,tasks,students,subs,evals,uploads,dashboard]=await Promise.all([api('/api/status'),api('/api/tasks'),api('/api/students'),api('/api/submissions'),api('/api/evaluations'),api('/api/uploads'),api('/api/dashboard')]);
  DATA={status,tasks,students,submissions:subs,evaluations:evals,uploads,dashboard}; render();
}
function setActive(){['home','teacher','student'].forEach(k=>{const el=$('top-'+k); if(el) el.classList.toggle('active', role===k)}); if(role==='student')$('chatFab').style.display='block';}
function overviewHero(){return `<section class="hero"><div class="card hero-main"><h2>让每一次数学思考，<br>都更可见、更可诊断、更可生长。</h2><p>本版为 <b>科技增强体验版</b>，基于你提供的五类高阶思维框架，重构了评价维度、可视化分析与作品证据页面。当前站点展示 <b>300 条演示学习记录</b>、<b>300 条评价记录</b>、<b>30 个数学任务</b> 与 <b>学生图片作品分析</b> 功能，用于测试微信公网访问体验。</p><div class="badge-row"><span class="badge">五大一级指标</span><span class="badge">12项思维特征</span><span class="badge">折线 / 雷达 / 条形 / 饼图</span><span class="badge">学生上传图片分析</span><span class="badge">小思智能伴学</span></div></div><div class="card hero-side"><div class="statgrid"><div class="stat"><b>${DATA.status.task_count}</b><span>数学探究任务</span></div><div class="stat"><b>${DATA.status.submission_count}</b><span>演示学习记录</span></div><div class="stat"><b>${DATA.status.evaluation_count}</b><span>演示评价记录</span></div><div class="stat"><b>${DATA.students.length}</b><span>演示学生</span></div></div><div class="warn">⚠ 当前为 <b>免费公网体验版</b>，只展示虚构演示数据，不接收或保存真实学生信息。微信中首次打开若较慢，通常是免费实例唤醒所致。</div></div></section>`}
function homePage(){
  const taskCards=DATA.tasks.slice(0,8).map(t=>`<div class="mini"><div><span class="k">${t.grade_text}</span><span class="k">${t.domain}</span><span class="k">${t.phase}</span></div><h4>${safe(t.title)}</h4><p>${safe(t.prompt)}</p></div>`).join('');
  return `${overviewHero()}<section class="card section"><h3>平台亮点</h3><div class="sub">围绕高阶思维培育的课堂、任务、评价与证据分析构建体验站</div><div class="cards"><div class="mini"><h4>评价框架升级</h4><p>评价要点切换为：抽象概括思维、策略灵活思维、批判质疑思维、迁移应用思维、创新生成思维，并细化为 12 项二级特征。</p></div><div class="mini"><h4>多图表数据驾驶舱</h4><p>采用折线图、雷达图、条形图、饼状图等多种图表呈现班级水平、维度对比、任务分布与成长趋势。</p></div><div class="mini"><h4>作品证据更完整</h4><p>增加学生上传图片作品分析入口，用于查看手写过程、几何作图、统计图表等作品的结构化反馈。</p></div><div class="mini"><h4>跨终端体验更强</h4><p>页面采用深蓝科技感视觉体系，适配手机、平板与电脑，在微信链接中也可直接打开体验。</p></div></div></section><section class="card section"><h3>示例任务</h3><div class="sub">以下仅展示部分任务</div><div class="cards">${taskCards}</div></section>`
}
function teacherPage(){
  const side=`<aside class="card sidebar"><h4 class="side-title">教师工作台</h4><div class="side-group"><a class="side-link active">数据驾驶舱</a><a class="side-link">任务与课例</a><a class="side-link">学生画像</a><a class="side-link">评价维度</a><a class="side-link">作品分析</a></div></aside>`;
  const topStudents=getTopStudents();
  const studentOptions=topStudents.map(s=>`<option value="${s.id}">${s.alias} · ${s.grade_text}</option>`).join('');
  const dimensionTable=SECONDARY.map(d=>{const item=DATA.dashboard.secondary_avg.find(x=>x.name===d);return `<div class="dim"><label>${d}</label><b>${item?item.value:'-'}</b></div>`}).join('');
  const tableRows=topStudents.map(s=>`<tr><td>${s.alias}</td><td>${s.grade_text}</td><td>${s.records}</td><td>${s.overall}</td><td>${s.best}</td><td>${s.focus}</td></tr>`).join('');
  const uploadRows=DATA.uploads.slice(0,8).map(u=>{const stu=DATA.students.find(s=>s.id===u.student_id); const task=DATA.tasks.find(t=>t.id===u.task_id);return `<tr><td>${safe(stu.alias)}</td><td>${safe(task.title)}</td><td>${u.type}</td><td>${u.analysis}</td></tr>`}).join('');
  return `${overviewHero()}<div class="grid">${side}<div class="content"><section class="card section"><h3>教师数据驾驶舱</h3><div class="sub">300条虚构记录的统计演示：各组数据不代表同一批学生真实纵向发展</div><div class="charts2"><div class="chartbox"><h4>演示记录分组趋势（折线图）</h4><canvas id="lineTrend"></canvas></div><div class="chartbox"><h4>五大一级指标画像（雷达图）</h4><canvas id="radarPrimary"></canvas></div></div><div class="charts2" style="margin-top:16px"><div class="chartbox"><h4>12项二级特征均值（条形图）</h4><canvas id="barSecondary"></canvas></div><div class="chartbox"><h4>总体水平分布（饼状图）</h4><canvas id="pieLevel"></canvas></div></div></section><section class="card section"><h3>一级指标与二级特征</h3><div class="sub">评价要点已调整为你提供的五个维度与对应思维特征</div><div class="cards">${Object.entries(DATA.dashboard.primary_groups).map(([k,arr])=>`<div class="mini"><h4>${k}</h4><p>${arr.map(x=>`<span class='k'>${x}</span>`).join('')}</p></div>`).join('')}</div><div class="dimgrid" style="margin-top:16px">${dimensionTable}</div></section><section class="card section"><h3>学生表现画像</h3><div class="sub">优先展示记录较完整的演示学生</div><div class="toolbar"><label>选择学生：</label><select id="studentSelect" onchange="renderStudentAnalysis()">${studentOptions}</select></div><div class="row2" style="margin-top:14px"><div class="chartbox"><h4>个体一级指标雷达图</h4><canvas id="studentRadar"></canvas></div><div class="chartbox"><h4>个体12项特征柱状图</h4><canvas id="studentBar"></canvas></div></div><div class="tablewrap" style="margin-top:16px"><table><thead><tr><th>学生</th><th>年级</th><th>记录数</th><th>总体水平</th><th>优势维度</th><th>建议关注</th></tr></thead><tbody>${tableRows}</tbody></table></div></section><section class="card section"><h3>图片作品分析</h3><div class="sub">支持查看学生上传图片的结构化分析（演示数据）</div><div class="tablewrap"><table><thead><tr><th>学生</th><th>任务</th><th>作品类型</th><th>分析摘要</th></tr></thead><tbody>${uploadRows}</tbody></table></div></section></div></div>`
}
function studentPage(){
  const tasks=DATA.tasks.slice(0,10).map(t=>`<div class="mini"><div><span class="k">${t.grade_text}</span><span class="k">${t.domain}</span><span class="k">${t.phase}</span></div><h4>${safe(t.title)}</h4><p>${safe(t.prompt)}</p></div>`).join('');
  return `${overviewHero()}<div class="grid"><aside class="card sidebar"><h4 class="side-title">学生学习台</h4><div class="side-group"><a class="side-link active">探究任务</a><a class="side-link">作品上传</a><a class="side-link">思维画像</a><a class="side-link">小思伴学</a></div></aside><div class="content"><section class="card section"><h3>本周探究任务</h3><div class="sub">示例学生可从以下任务中进行体验</div><div class="cards">${tasks}</div></section><section class="card section"><h3>上传作品并分析</h3><div class="sub">在浏览器本地检测图片分辨率与画面明暗分布；不识别数学内容、不上传图片</div><div class="upload-zone"><div class="toolbar"><select id="uploadKind"><option>手写演算</option><option>几何作图</option><option>统计图表</option><option>思维导图</option></select><input id="uploadTitle" placeholder="输入作品标题，例如：平行四边形面积推导"><input type="file" accept="image/*" id="fileInput"></div><div style="margin-top:12px"><button class="btn" onclick="analyzeUpload()">本地检测图片</button></div><div id="uploadResult"></div></div></section><section class="card section"><h3>我的思维画像</h3><div class="sub">以下为演示学生“演示·星星”的虚构样例画像</div><div class="row2"><div class="chartbox"><h4>五类高阶思维雷达图</h4><canvas id="myRadar"></canvas></div><div class="chartbox"><h4>12项思维特征条形图</h4><canvas id="myBar"></canvas></div></div></section></div></div>`
}
function getTopStudents(){
 const map={};
 DATA.evaluations.forEach(e=>{const stu=DATA.students.find(s=>s.id===e.student_id); if(!map[stu.id]) map[stu.id]={id:stu.id,alias:stu.alias,grade_text:stu.grade_text,records:0,primary:{},secondary:{},focus:''}; const m=map[stu.id]; m.records++; Object.entries(e.primary).forEach(([k,v])=>m.primary[k]=(m.primary[k]||0)+v); Object.entries(e.ratings).forEach(([k,v])=>m.secondary[k]=(m.secondary[k]||0)+v); });
 return Object.values(map).map(s=>{PRIMARY.forEach(k=>s.primary[k]=+(s.primary[k]/s.records).toFixed(2)); SECONDARY.forEach(k=>s.secondary[k]=+((s.secondary[k]||0)/s.records).toFixed(2)); const p=Object.entries(s.primary).sort((a,b)=>b[1]-a[1]); s.best=p[0][0]; s.focus=p[p.length-1][0]; const avg=(Object.values(s.primary).reduce((a,b)=>a+b,0)/5); s.overall=avg<2.2?'基础':avg<3.1?'发展':'提升'; return s;}).sort((a,b)=>b.records-a.records || b.secondary['抽象性']-a.secondary['抽象性']);
}
let charts=[]; function killCharts(){charts.forEach(c=>c.destroy && c.destroy()); charts=[]}
function drawTeacherCharts(){killCharts(); const c1=new Chart($('lineTrend'),{type:'line',data:{labels:DATA.dashboard.trend.map(x=>x.period),datasets:[{label:'平均水平',data:DATA.dashboard.trend.map(x=>x.avg),borderColor:'#6fd6ff',backgroundColor:'rgba(111,214,255,.15)',fill:true,tension:.32}]},options:commonChartOptions('y',1,4)}); charts.push(c1);
 const c2=new Chart($('radarPrimary'),{type:'radar',data:{labels:Object.keys(DATA.dashboard.primary_summary),datasets:[{label:'班级均值',data:Object.values(DATA.dashboard.primary_summary),backgroundColor:'rgba(90,140,255,.18)',borderColor:'#7c9eff',pointBackgroundColor:'#a9bbff'}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#dbe8ff'}}},scales:{r:{min:0,max:4,grid:{color:'rgba(255,255,255,.1)'},angleLines:{color:'rgba(255,255,255,.08)'},pointLabels:{color:'#dbe8ff'},ticks:{display:false},beginAtZero:true}}}}); charts.push(c2);
 const c3=new Chart($('barSecondary'),{type:'bar',data:{labels:DATA.dashboard.secondary_avg.map(x=>x.name),datasets:[{label:'均值',data:DATA.dashboard.secondary_avg.map(x=>x.value),backgroundColor:['#5a8cff','#5a8cff','#6fd6ff','#6fd6ff','#8b7dff','#8b7dff','#8b7dff','#4ade80','#4ade80','#fbbf24','#fbbf24','#fb7185']}]},options:commonChartOptions('y',0,4)}); charts.push(c3);
 const c4=new Chart($('pieLevel'),{type:'pie',data:{labels:DATA.dashboard.level_distribution.map(x=>x.name),datasets:[{data:DATA.dashboard.level_distribution.map(x=>x.value),backgroundColor:['#fb7185','#5a8cff','#4ade80']}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e7efff'}}}}}); charts.push(c4);
 renderStudentAnalysis(); }
function commonChartOptions(axis,min,max){return {maintainAspectRatio:false,responsive:true,plugins:{legend:{labels:{color:'#e9f1ff'}}},scales: axis? {[axis]:{min:min,max:max,grid:{color:'rgba(255,255,255,.08)'},ticks:{color:'#cfe1ff'}}, x:{grid:{display:false},ticks:{color:'#cfe1ff',maxRotation:50,minRotation:50}}}:undefined}}
function renderStudentAnalysis(){ const arr=getTopStudents(); const s=arr.find(x=>String(x.id)===String($('studentSelect').value)) || arr[0]; if(!s)return; ['studentRadar','studentBar'].forEach(id=>{const old=Chart.getChart(id); if(old) old.destroy();}); const r=new Chart($('studentRadar'),{type:'radar',data:{labels:PRIMARY,datasets:[{label:s.alias,data:PRIMARY.map(k=>s.primary[k]),backgroundColor:'rgba(111,214,255,.16)',borderColor:'#6fd6ff'}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#fff'}}},scales:{r:{min:0,max:4,grid:{color:'rgba(255,255,255,.1)'},pointLabels:{color:'#dbe8ff'},ticks:{display:false}}}}}); const b=new Chart($('studentBar'),{type:'bar',data:{labels:SECONDARY,datasets:[{label:'得分',data:SECONDARY.map(k=>s.secondary[k]),backgroundColor:'#7c9eff'}]},options:commonChartOptions('y',0,4)}); charts.push(r,b); }
function drawStudentCharts(){ const s=getTopStudents()[0]; const r=new Chart($('myRadar'),{type:'radar',data:{labels:PRIMARY,datasets:[{label:s.alias,data:PRIMARY.map(k=>s.primary[k]),backgroundColor:'rgba(74,222,128,.16)',borderColor:'#4ade80'}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#fff'}}},scales:{r:{min:0,max:4,grid:{color:'rgba(255,255,255,.1)'},pointLabels:{color:'#dbe8ff'},ticks:{display:false}}}}}); const b=new Chart($('myBar'),{type:'bar',data:{labels:SECONDARY,datasets:[{label:'得分',data:SECONDARY.map(k=>s.secondary[k]),backgroundColor:'#6fd6ff'}]},options:commonChartOptions('y',0,4)}); charts.push(r,b); }
function previewImage(file){return new Promise(res=>{const reader=new FileReader(); reader.onload=()=>res(reader.result); reader.readAsDataURL(file);})}
async function analyzeUpload(){
 const file=$('fileInput').files[0]; if(!file){$('uploadResult').innerHTML='<div class="warn">请先选择图片。本功能不会识别手写数学答案，也不会给出真实思维评分。</div>';return}
 if(!file.type.startsWith('image/')||file.size>6*1024*1024){$('uploadResult').innerHTML='<div class="warn">请选择6MB以内的图片。</div>';return}
 let preview,meta;try{
 preview=await previewImage(file);const img=new Image();img.src=preview;await img.decode();
 const scale=Math.min(1,240/img.naturalWidth,240/img.naturalHeight),c=document.createElement('canvas');
 c.width=Math.max(1,Math.floor(img.naturalWidth*scale));c.height=Math.max(1,Math.floor(img.naturalHeight*scale));
 const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,c.width,c.height);
 const v=cx.getImageData(0,0,c.width,c.height).data;let sum=0,sum2=0,dark=0,n=0;
 for(let i=0;i<v.length;i+=4){const light=.2126*v[i]+.7152*v[i+1]+.0722*v[i+2];sum+=light;sum2+=light*light;dark+=(light<110);n++}
 meta={w:img.naturalWidth,h:img.naturalHeight,kb:Math.round(file.size/1024),contrast:Math.round(Math.sqrt(Math.max(0,sum2/n-(sum/n)**2))),dark:Math.round(dark/n*100)};
 }catch(e){$('uploadResult').innerHTML='<div class="warn">图片无法解析，请选择 JPG 或 PNG。</div>';return}
 const kind=$('uploadKind').value;
 const quality=[];
 if(meta.w<700||meta.h<700)quality.push('分辨率偏低，建议重新拍照，方便教师查看笔迹。');
 if(meta.contrast<30)quality.push('画面对比度偏低，建议增强光线并避免反光。');
 if(meta.dark<3)quality.push('笔迹可能过淡或主体过小，建议检查内容是否完整入镜。');
 if(!quality.length)quality.push('图片的基本尺寸和明暗分布适合进一步查看，但仍需教师判断数学内容。');
 const prompts={'手写演算':['每一步的理由是什么？','还有什么不同算法？','改动条件后还能用吗？'],'几何作图':['关键的几何关系是什么？','画图步骤是否有依据？','还能证明哪些结论？'],'统计图表':['调查是否公平？','结论是否被数据支持？','换一种统计方式会怎样？'],'思维导图':['概念间的联系是什么？','有反例吗？','还能迁移到哪些问题？']}[kind]||[];
 $('uploadResult').innerHTML='<div class="preview"><div><img alt="本地图片预览" src="'+preview+'"><p class="sub">图片没有上传到服务器</p></div><div class="analysis"><b>真实检测：'+safe(kind)+'</b><p>尺寸：'+meta.w+' × '+meta.h+' 像素<br>文件：'+meta.kb+'KB<br>明暗对比度指标：'+meta.contrast+'<br>深色区域占比：'+meta.dark+'%</p><b>图片呈现建议</b><ul>'+quality.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul><b>数学思维追问建议</b><ul>'+prompts.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul><div class="warn" style="margin-top:12px">这里分析的是图片像素质量，不识别题目、手写文字、数学解法，也不生成个人思维等级。数学追问为固定的通用提示，不是AI识图结论。</div></div></div>';
}
function toggleChat(){ $('chatBox').classList.toggle('open'); }
async function sendChat(){ const q=$('chatInput').value.trim(); if(!q)return; $('chatBody').insertAdjacentHTML('beforeend',`<div class='bubble me'>${safe(q)}</div>`); $('chatInput').value=''; $('chatBody').scrollTop=$('chatBody').scrollHeight; const res=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,mode:$('chatMode').value})}); $('chatBody').insertAdjacentHTML('beforeend',`<div class='bubble'>${safe(res.reply||'暂时无法回答')}</div>`); $('chatBody').scrollTop=$('chatBody').scrollHeight; }
function render(){ setActive(); const app=$('app'); if(role==='teacher') app.innerHTML=teacherPage(); else if(role==='student') app.innerHTML=studentPage(); else app.innerHTML=homePage(); if(role==='teacher') setTimeout(drawTeacherCharts,20); if(role==='student') setTimeout(drawStudentCharts,20); }
boot();
</script>
