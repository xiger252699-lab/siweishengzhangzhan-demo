<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103e81"><title>思维生长站 · 小学数学高阶思维培育</title>
<style>
:root{--navy:#113c7a;--blue:#246bd2;--ink:#173359;--pale:#eef5ff;--line:#dbe7f7;--muted:#71849d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft Yahei",sans-serif;background:#f3f7fd;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#0d3878,#216dd4);color:white;padding:18px max(18px,calc((100vw - 1220px)/2));display:flex;gap:16px;justify-content:space-between;align-items:center}header strong{font-size:21px;letter-spacing:1px}header span{display:block;font-size:12px;opacity:.85;margin-top:3px}nav{display:flex;gap:6px;flex-wrap:wrap}nav button,.btn{border:0;border-radius:11px;padding:10px 15px;background:#e9f2ff;color:#1955a8;font-weight:650}nav button.active,.btn.primary{background:#1768d1;color:white}.wrap{max-width:1220px;margin:auto;padding:24px 18px 86px}.hero{background:linear-gradient(115deg,#f7fbff,#e2efff);border:1px solid #d5e6fa;border-radius:23px;padding:28px 30px;margin-bottom:18px}.hero h1{font-size:29px;margin:4px 0 10px}.hero p{color:#516784;line-height:1.7}.pill{display:inline-block;border-radius:30px;background:#d5e7ff;padding:6px 12px;font-size:12px;color:#205a9d;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);box-shadow:0 8px 30px #163d7610;border-radius:18px;padding:20px;min-width:0}.card h2{margin:0 0 15px;font-size:19px}.stat{font-size:30px;font-weight:800;color:#1865cf}.muted{color:var(--muted);font-size:13px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{padding:15px 16px;border:1px solid var(--line);background:#f8fbff;border-radius:13px;text-align:left}.tile strong{display:block;margin-bottom:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wraprow{flex-wrap:wrap}.list{display:grid;gap:10px}.item{border:1px solid var(--line);padding:15px;border-radius:13px;background:white}.item strong{font-size:15px}.tag{display:inline-block;border-radius:8px;background:#edf5ff;color:#2564ad;padding:4px 8px;font-size:12px;margin:5px 5px 0 0}.subtle{background:#fff9e9;border:1px solid #f7e1a9;border-radius:11px;padding:11px 14px;color:#7b6024;font-size:13px;margin:10px 0 20px;line-height:1.6}select,input,textarea{width:100%;border:1px solid #cfdff2;border-radius:11px;padding:12px;background:white;color:var(--ink)}textarea{min-height:115px;resize:vertical}label{display:block;font-size:13px;font-weight:700;margin:11px 0 6px}.dim{display:flex;justify-content:space-between;border-bottom:1px solid #e8eef7;padding:10px 2px}.bars{height:9px;border-radius:20px;background:#e3eefe;overflow:hidden;margin:8px 0 15px}.bars>div{height:100%;background:linear-gradient(90deg,#4a97ed,#195ac9)}.robot{position:fixed;right:21px;bottom:23px;z-index:30;border:3px solid white;box-shadow:0 10px 35px #224f9266;border-radius:50%;width:74px;height:74px;background:linear-gradient(140deg,#3eaaeb,#1766d4);color:white;font-size:31px}.robot small{position:absolute;font-size:11px;bottom:-10px;left:21px;background:#fff;color:#2062b6;border-radius:10px;padding:1px 7px}.chat{position:fixed;z-index:40;right:20px;bottom:110px;width:min(390px,calc(100vw - 24px));height:min(590px,calc(100dvh - 140px));display:none;flex-direction:column;background:white;border-radius:19px;border:1px solid #c9dafa;box-shadow:0 15px 55px #133a754a;overflow:hidden}.chat.open{display:flex}.chathead{background:linear-gradient(110deg,#134785,#287adf);color:white;padding:17px;display:flex;justify-content:space-between}.chatbody{overflow:auto;flex:1;padding:15px;background:#f5f9ff}.bubble{margin:8px 0;padding:12px;border-radius:13px;background:white;line-height:1.65;max-width:92%;font-size:14px}.bubble.me{background:#d8ebff;margin-left:auto}.chatform{padding:12px;border-top:1px solid var(--line)}.chatform .row{margin-top:9px}footer{font-size:12px;color:#8393ad;text-align:center;margin:30px 0}.wide{grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:1fr}header{padding:14px 18px}header strong{font-size:18px}}@media(max-width:540px){header{display:block}nav{margin-top:12px}nav button{padding:10px 11px;font-size:13px}.grid{grid-template-columns:1fr}.wrap{padding:15px 12px 90px}.hero{padding:21px}.hero h1{font-size:24px}.card{padding:17px}.chat{right:0;bottom:0;width:100vw;height:100dvh;border-radius:0}.robot{bottom:20px;right:15px}} 
</style></head><body><header><div><strong>✦ 思维生长站</strong><span>小学数学高阶思维培育 · 智能伴学平台</span></div><nav><button id="nav-home" onclick="go('/')">平台首页</button><button id="nav-teacher" onclick="go('/teacher.html')">教师工作台</button><button id="nav-student" onclick="go('/student.html')">学生学习台</button></nav></header>
<main class="wrap" id="root"></main><footer>仅供软件功能展示 · 所有学生与评价均为虚构示例 · 禁止输入真实学生资料</footer>
<button class="robot" id="robot" style="display:none" onclick="toggleChat()" aria-label="与小思聊天">🤖<small>小思</small></button><section class="chat" id="chat"><div class="chathead"><strong>🤖 小思 · 数学思维伙伴</strong><button class="btn" onclick="toggleChat()">关闭</button></div><div class="chatbody" id="chatbody"><div class="bubble">你好呀！我是小思。数学不只是找到答案，还要思考“为什么”。你有什么问题想一起研究？</div></div><div class="chatform"><select id="mode"><option>启发式</option><option>建构式</option><option>评估式</option></select><div class="row"><input id="ask" maxlength="400" placeholder="把你的数学问题告诉小思…" onkeydown="if(event.key==='Enter')askRobot()"><button class="btn primary" onclick="askRobot()">发送</button></div></div></section>
<script>
const url=location.pathname,role=url.includes('teacher')?'teacher':url.includes('student')?'student':'home';let TASKS=[],STUDENTS=[],SUB=[],EVAL=[],selected=1;const $=id=>document.getElementById(id);function go(p){location.href=p}function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(){return '<div class="subtle">⚠️ 免费公网体验版：只展示虚构学生、虚构评价和规则式“小思”，不收集真实学生数据；本版不具备长期在线存储、正式AI模型或正式教学评价资质。</div>'}async function init(){try{[TASKS,STUDENTS,SUB,EVAL]=await Promise.all(['/api/tasks','/api/students','/api/submissions','/api/evaluations'].map(x=>fetch(x).then(r=>r.json())))}catch(e){$('root').innerHTML='<div class="card">暂时无法连接服务，请稍后刷新页面。</div>';return}document.querySelector('#nav-'+role).classList.add('active');if(role==='home')home();else if(role==='teacher')teacher();else{$('robot').style.display='block';student()}}function home(){$('root').innerHTML='<div class="hero"><span class="pill">智慧学习 · 思维生长</span><h1>让每一次思考，都有迹可循。</h1><p>面向小学数学四大学习领域，展示教师教学支持、学生探究、策略型/批判型/创新型思维发展观察与“小思”伴学交互。</p><div class="row wraprow"><button class="btn primary" onclick="go(\'/teacher.html\')">进入教师工作台</button><button class="btn" onclick="go(\'/student.html\')">进入学生学习台</button></div></div>'+notice()+'<div class="grid"><article class="card"><div class="stat">'+TASKS.length+'</div>数学探究任务</article><article class="card"><div class="stat">'+STUDENTS.length+'</div>虚构体验学生</article><article class="card"><div class="stat">11</div>思维评价维度</article></div><div class="card" style="margin-top:16px"><h2>平台的两个入口</h2><div class="tiles"><div class="tile"><strong>👩‍🏫 教师工作台</strong>任务检索 · 学习证据 · 思维表现画像</div><div class="tile"><strong>🧑‍🎓 学生学习台</strong>数学探究 · 小思追问 · 自主反思</div></div></div>'}function metricTitle(){return '<span class="tag">策略型：抽象/多样/择优/迁移</span><span class="tag">批判型：质疑/解构/辩证/建构</span><span class="tag">创新型：拓展/发散/创造</span>'}function teacher(){$('root').innerHTML='<div class="hero"><span class="pill">教师工作台 · 公开演示</span><h1>循证观察学生的思维生长</h1><p>阅读任务、查看虚构学生的学习证据、观察11维模拟评价。此公网演示不开放教师写入真实评价。</p></div>'+notice()+'<div class="grid"><div class="card"><div class="stat">'+TASKS.length+'</div>任务资源</div><div class="card"><div class="stat">'+SUB.length+'</div>演示作答记录</div><div class="card"><div class="stat">'+EVAL.length+'</div>虚构评价记录</div><section class="card wide"><h2>任务资源库</h2><div class="row wraprow"><select id="filter" onchange="tasksView()" style="max-width:290px"><option value="">全部领域</option>'+[...new Set(TASKS.map(x=>x.domain))].map(x=>'<option>'+safe(x)+'</option>').join('')+'</select><select id="grade" onchange="tasksView()" style="max-width:220px"><option value="">全部年级</option>'+[1,2,3,4,5,6].map(x=>'<option value="'+x+'">'+x+'年级</option>').join('')+'</select></div><div id="tasks" class="list" style="max-height:400px;overflow:auto;margin-top:13px"></div></section><section class="card"><h2>学生样例档案</h2><div id="studentlist" class="list">'+STUDENTS.map(s=>'<button class="tile" onclick="profile('+s.id+')">'+safe(s.alias)+' · '+s.grade+'年级</button>').join('')+'</div></section><section class="card" style="grid-column:span 2"><h2>思维发展模拟画像</h2><div id="profile">请点击左侧一个演示学生查看11维模拟评价。</div></section></div>';tasksView();profile(1)}function tasksView(){const domain=$('filter')?.value||'',grade=$('grade')?.value||'';const v=TASKS.filter(x=>(!domain||x.domain===domain)&&(!grade||String(x.grade)===grade));$('tasks').innerHTML=v.map(t=>'<div class="item"><strong>'+safe(t.title)+'</strong><div><span class="tag">'+safe(t.domain)+'</span><span class="tag">'+t.grade+'年级</span><span class="tag">'+safe(t.phase)+'</span></div><p class="muted">'+safe(t.prompt)+'</p></div>').join('')}function profile(id){const s=STUDENTS.find(x=>x.id===id),subs=SUB.filter(x=>x.student_id===id),scores=Object.fromEntries(Object.entries({'策略型思维':['抽象性','多样性','择优性','迁移性'],'批判型思维':['质疑性','解构性','辩证性','建构性'],'创新型思维':['拓展性','发散性','创造性']}).map(([g,d])=>[g,d]));let html='<strong>'+safe(s.alias)+' · '+s.grade+'年级</strong><p class="muted">仅为虚构评价数据，不能用于研究统计。</p>';for(const [group,dims] of Object.entries(scores)){html+='<h3>'+group+'</h3>';for(const d of dims){const ratings=subs.map(q=>(EVAL.find(e=>e.submission_id===q.id)||{}).ratings?.[d]).filter(Boolean);const val=ratings.length?ratings.reduce((a,b)=>a+b,0)/ratings.length:0;html+='<div class="dim"><span>'+d+'</span><strong>'+val.toFixed(1)+'/4</strong></div><div class="bars"><div style="width:'+val*25+'%"></div></div>'}}html+='<h3>相关学习证据</h3>'+subs.slice(0,3).map(x=>'<p class="item">'+safe(TASKS.find(t=>t.id===x.task_id)?.title)+'：'+safe(x.answer)+'</p>').join('');$('profile').innerHTML=html}function student(){$('root').innerHTML='<div class="hero"><span class="pill">学生学习台 · 公开演示</span><h1>跟小思一起，让思考更进一步！</h1><p>先自己猜想、解释与比较，再向小思请教。点击右下方蓝色小机器人就能开始对话。</p><button class="btn primary" onclick="toggleChat()">🤖 找小思聊数学</button></div>'+notice()+'<div class="grid"><section class="card wide"><h2>探索数学任务</h2><div class="row wraprow"><select id="studDomain" onchange="studentTasks()" style="max-width:300px"><option value="">全部领域</option>'+[...new Set(TASKS.map(x=>x.domain))].map(x=>'<option>'+safe(x)+'</option>').join('')+'</select><select id="studGrade" onchange="studentTasks()" style="max-width:200px"><option value="">全部年级</option>'+[1,2,3,4,5,6].map(x=>'<option value="'+x+'">'+x+'年级</option>').join('')+'</select></div><div id="studenttasks" class="list" style="margin-top:14px;max-height:380px;overflow:auto"></div></section><section class="card" style="grid-column:span 2"><h2>我的思考（本页演示，不上传）</h2><div id="prompt" class="item"></div><label>先写下自己的想法</label><textarea id="thought" placeholder="我发现……；我的理由是……；我还能尝试……"></textarea><div class="row wraprow" style="margin-top:12px"><button class="btn primary" onclick="reflect()">帮我检查思考步骤</button><span class="muted">内容仅留在当前浏览器页面，不会提交服务器</span></div><div id="reflection"></div></section><section class="card"><h2>思考锦囊</h2>'+metricTitle()+'<p>寻找依据、比较策略、提出质疑、尝试迁移，都是高质量的数学思考。</p></section></div>';studentTasks();pick(1)}function studentTasks(){const d=$('studDomain').value,g=$('studGrade').value;$('studenttasks').innerHTML=TASKS.filter(x=>(!d||d===x.domain)&&(!g||String(x.grade)===g)).map(t=>'<button class="tile" onclick="pick('+t.id+')"><strong>'+safe(t.title)+'</strong><span class="tag">'+safe(t.domain)+'</span><span class="tag">'+t.grade+'年级</span></button>').join('')}function pick(id){selected=id;const t=TASKS.find(x=>x.id===id);$('prompt').innerHTML='<strong>'+safe(t.title)+'</strong><p>'+safe(t.prompt)+'</p><span class="tag">'+safe(t.concept)+'</span>';$('thought').value='';$('reflection').innerHTML=''}function reflect(){const value=$('thought').value.trim();$('reflection').innerHTML='<div class="subtle">'+(value.length<25?'先尝试再写得具体些：你能说明猜想、依据和一个例子吗？':'你已经记录了自己的思路。接下来试着回答：你的理由足够充分吗？有没有第二种方法？如果条件变化，方法还成立吗？')+'</div>'}function toggleChat(){$('chat').classList.toggle('open')}async function askRobot(){const q=$('ask').value.trim();if(!q)return;const chat=$('chatbody');chat.innerHTML+='<div class="bubble me">'+safe(q)+'</div>';$('ask').value='';chat.scrollTop=chat.scrollHeight;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,mode:$('mode').value})});const d=await r.json();chat.innerHTML+='<div class="bubble">'+safe(d.reply||d.error)+'</div>'}catch(e){chat.innerHTML+='<div class="bubble">网络暂时出现问题，请稍后再试。</div>'}chat.scrollTop=chat.scrollHeight}init();
</script></body></html>
